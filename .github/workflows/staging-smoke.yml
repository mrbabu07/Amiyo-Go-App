name: Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  verify:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - name: Public marketplace contract smoke
        run: npm run smoke:marketplace
        env:
          SMOKE_API_URL: ${{ vars.API_PUBLIC_URL }}
          SMOKE_REQUIRE_DATA: "1"
          SMOKE_EXPECTED_RELEASE: ${{ github.sha }}
          SMOKE_REPORT_PATH: staging-marketplace-smoke.json
      - name: Bounded public catalog load smoke
        run: npm run smoke:load
        env:
          LOAD_TARGET_URL: ${{ vars.LOAD_TARGET_URL }}
          LOAD_REQUESTS: "250"
          LOAD_CONCURRENCY: "10"
          LOAD_WARMUP_REQUESTS: "5"
          LOAD_TIMEOUT_MS: "20000"
          LOAD_MAX_FAILURE_RATE: "0"
          LOAD_MAX_P95_MS: "1500"
          LOAD_REPORT_PATH: staging-load-smoke.json
      - name: Authenticated role-boundary smoke
        run: npm run smoke:staging-authenticated
        env:
          SMOKE_API_URL: ${{ vars.API_PUBLIC_URL }}
          STAGING_CUSTOMER_TOKEN: ${{ secrets.STAGING_CUSTOMER_TOKEN }}
          STAGING_VENDOR_TOKEN: ${{ secrets.STAGING_VENDOR_TOKEN }}
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
          SMOKE_MAX_P95_MS: "2500"
          SMOKE_REPORT_PATH: staging-authenticated-smoke.json
      - name: Bounded authenticated seller load smoke
        run: npm run smoke:load
        env:
          LOAD_TARGET_ORIGIN: ${{ vars.API_PUBLIC_URL }}
          LOAD_TARGET_PATH: /api/v2/vendor/orders?limit=1
          LOAD_BEARER_TOKEN: ${{ secrets.STAGING_VENDOR_TOKEN }}
          LOAD_REQUESTS: "40"
          LOAD_CONCURRENCY: "4"
          LOAD_WARMUP_REQUESTS: "4"
          LOAD_TIMEOUT_MS: "20000"
          LOAD_MAX_FAILURE_RATE: "0"
          LOAD_MAX_P95_MS: "2500"
          LOAD_REPORT_PATH: staging-authenticated-load-smoke.json
      - name: Upload immutable smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            staging-marketplace-smoke.json
            staging-load-smoke.json
            staging-authenticated-smoke.json
            staging-authenticated-load-smoke.json
          if-no-files-found: error
          retention-days: 30
