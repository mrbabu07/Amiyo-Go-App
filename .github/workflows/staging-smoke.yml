name: Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  verify:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - name: Validate staging smoke targets
        run: npm run smoke:staging-preflight
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          LOAD_TARGET_URL: ${{ vars.LOAD_TARGET_URL }}
      - name: Public marketplace contract smoke
        run: npm run smoke:marketplace
        env:
          SMOKE_API_URL: ${{ vars.API_PUBLIC_URL }}
          SMOKE_REQUIRE_DATA: "1"
          SMOKE_EXPECTED_RELEASE: ${{ github.sha }}
          SMOKE_REPORT_PATH: staging-marketplace-smoke.json
      - name: Bounded public catalog load smoke
        run: npm run smoke:load
        env:
          LOAD_TARGET_URL: ${{ vars.LOAD_TARGET_URL }}
          LOAD_REQUESTS: "250"
          LOAD_CONCURRENCY: "10"
          LOAD_WARMUP_REQUESTS: "5"
          LOAD_TIMEOUT_MS: "20000"
          LOAD_MAX_FAILURE_RATE: "0"
          LOAD_MAX_P95_MS: "1500"
          LOAD_REPORT_PATH: staging-load-smoke.json
      - name: Authenticated role and seller-load smoke
        run: node scripts/staging-firebase-tokens.mjs
        env:
          SMOKE_API_URL: ${{ vars.API_PUBLIC_URL }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_CUSTOMER_EMAIL: ${{ secrets.STAGING_CUSTOMER_EMAIL }}
          STAGING_CUSTOMER_PASSWORD: ${{ secrets.STAGING_CUSTOMER_PASSWORD }}
          STAGING_VENDOR_EMAIL: ${{ secrets.STAGING_VENDOR_EMAIL }}
          STAGING_VENDOR_PASSWORD: ${{ secrets.STAGING_VENDOR_PASSWORD }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          SMOKE_MAX_P95_MS: "2500"
          SMOKE_REPORT_PATH: staging-authenticated-smoke.json
          LOAD_TARGET_PATH: /api/v2/vendor/orders?limit=1
          LOAD_REQUESTS: "40"
          LOAD_CONCURRENCY: "4"
          LOAD_WARMUP_REQUESTS: "4"
          LOAD_TIMEOUT_MS: "20000"
          LOAD_MAX_FAILURE_RATE: "0"
          LOAD_MAX_P95_MS: "2500"
          LOAD_REPORT_PATH: staging-authenticated-load-smoke.json
      - name: Upload immutable smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            staging-marketplace-smoke.json
            staging-load-smoke.json
            staging-authenticated-smoke.json
            staging-authenticated-load-smoke.json
          if-no-files-found: error
          retention-days: 30
