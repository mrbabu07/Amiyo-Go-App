name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run openapi:generate && git diff --exit-code
      - run: npm run secret:scan
      - run: npm run release:check
        env:
          RELEASE_REPORT_PATH: ci-release-readiness.json
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ci
          RELEASE_RUN_ID: ${{ github.run_id }}
      - run: npm run export:web --workspace @amiyo/mobile
      - run: npm audit --audit-level=high
      - name: Upload CI release-readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-release-readiness-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-release-readiness.json
          if-no-files-found: ignore
          retention-days: 30

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/api/Dockerfile -t amiyo-api:${{ github.sha }} .
      - run: docker build -f apps/worker/Dockerfile -t amiyo-worker:${{ github.sha }} .
