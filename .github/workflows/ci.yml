name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run openapi:generate && git diff --exit-code
      - run: npm run secret:scan
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - run: npm run export:web --workspace @amiyo/mobile

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/api/Dockerfile -t amiyo-api:${{ github.sha }} .
      - run: docker build -f apps/worker/Dockerfile -t amiyo-worker:${{ github.sha }} .
