name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Verify production source branch
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"
      - run: npm ci
      - name: Materialize protected production evidence
        if: ${{ inputs.environment == 'production' }}
        run: npm run release:evidence-files
        env:
          ANDROID_DEVICE_EVIDENCE_JSON: ${{ secrets.ANDROID_DEVICE_EVIDENCE_JSON }}
          IOS_DEVICE_EVIDENCE_JSON: ${{ secrets.IOS_DEVICE_EVIDENCE_JSON }}
          FINANCE_PROVIDER_EVIDENCE_JSON: ${{ secrets.FINANCE_PROVIDER_EVIDENCE_JSON }}
          RESTORE_RELEASE_EVIDENCE_JSON: ${{ secrets.RESTORE_RELEASE_EVIDENCE_JSON }}
          STAGING_SMOKE_EVIDENCE_JSON: ${{ secrets.STAGING_SMOKE_EVIDENCE_JSON }}
          RETENTION_APPROVAL_EVIDENCE_JSON: ${{ secrets.RETENTION_APPROVAL_EVIDENCE_JSON }}
      - name: Verify release readiness
        run: npm run release:check
        env:
          REQUIRE_PRODUCTION_READY: ${{ inputs.environment == 'production' && 'true' || 'false' }}
          RELEASE_REPORT_PATH: release-readiness.json
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          ANDROID_DEVICE_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'android-device-evidence.json' || '' }}
          IOS_DEVICE_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'ios-device-evidence.json' || '' }}
          FINANCE_PROVIDER_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'finance-provider-evidence.json' || '' }}
          RESTORE_RELEASE_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'restore-release-evidence.json' || '' }}
          STAGING_SMOKE_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'staging-smoke-evidence.json' || '' }}
          RETENTION_APPROVAL_EVIDENCE_PATH: ${{ inputs.environment == 'production' && 'retention-approval-evidence.json' || '' }}
      - name: Upload release-readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-${{ inputs.environment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-readiness.json
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run build --workspace @amiyo/config
      - run: npm run release:deploy-env
        env:
          NODE_ENV: ${{ inputs.environment }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_USE_APPLICATION_DEFAULT: ${{ vars.FIREBASE_USE_APPLICATION_DEFAULT }}
          OBJECT_STORAGE_PUBLIC_URL: ${{ vars.OBJECT_STORAGE_PUBLIC_URL }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          SSLCOMMERZ_SANDBOX: ${{ vars.SSLCOMMERZ_SANDBOX }}
          PARCEL_QR_SIGNING_SECRET: ${{ secrets.PARCEL_QR_SIGNING_SECRET }}
          AMIYO_DELIVERY_API_URL: ${{ vars.AMIYO_DELIVERY_API_URL }}
          AMIYO_DELIVERY_INTEGRATION_TOKEN: ${{ secrets.AMIYO_DELIVERY_INTEGRATION_TOKEN }}
          AMIYO_DELIVERY_WEBHOOK_SECRET: ${{ secrets.AMIYO_DELIVERY_WEBHOOK_SECRET }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_PROVIDER_API_URL: ${{ vars.EMAIL_PROVIDER_API_URL }}
          EMAIL_PROVIDER_TOKEN: ${{ secrets.EMAIL_PROVIDER_TOKEN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

  images:
    environment: ${{ inputs.environment }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RELEASE_COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/amiyo-api:${{ github.sha }}
      - id: worker_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RELEASE_COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/amiyo-worker:${{ github.sha }}
      - name: Create immutable image manifest
        run: npm run release:manifest
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_MANIFEST_PATH: release-image-manifest.json
          API_IMAGE_REFERENCE: ghcr.io/${{ github.repository_owner }}/amiyo-api:${{ github.sha }}
          API_IMAGE_DIGEST: ${{ steps.api_image.outputs.digest }}
          WORKER_IMAGE_REFERENCE: ghcr.io/${{ github.repository_owner }}/amiyo-worker:${{ github.sha }}
          WORKER_IMAGE_DIGEST: ${{ steps.worker_image.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images-${{ inputs.environment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-image-manifest.json
          if-no-files-found: error
          retention-days: 30

  migrate:
    environment: ${{ inputs.environment }}
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
